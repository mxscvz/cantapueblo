<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cantapueblo</title>
  <meta http-equiv="refresh" content="0; url={{ '/es/' | relative_url }}">

    var lang = (navigator.language || 'es').toLowerCase();

    window.location.replace(target);
  </script>
</head>
<body>
