<!DOCTYPE html>
<html lang="{{ page.lang | default: 'es' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} · Cantapueblo</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title }} · Cantapueblo">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ '/assets/img/og-image.jpg' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:locale" content="{% if page.lang == 'en' %}en_US{% elsif page.lang == 'fr' %}fr_FR{% else %}es_AR{% endif %}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }} · Cantapueblo">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ '/assets/img/og-image.jpg' | absolute_url }}">

  {% if page.lang %}
  {% for lang_entry in site.data.i18n %}
  <link rel="alternate" hreflang="{{ lang_entry[0] }}" href="{{ lang_entry[1][page.section] | absolute_url }}">
  {% endfor %}
  <link rel="alternate" hreflang="x-default" href="{{ site.data.i18n['es'][page.section] | absolute_url }}">
  {% endif %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {% include nav.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/header-shrink.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/reveal.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/carousel.js' | relative_url }}"></script>
</body>
</html>
